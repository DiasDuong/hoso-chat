name: hrbot

services:
  postgres:
    image: postgres:16
    container_name: hrbot-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-hr_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-WVTd1BjqlizHbMcsro43PwQaO8meSAfL}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - hrbot_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrbot -d hrbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hrbot-qdrant-1
    restart: unless-stopped
    volumes:
      - hrbot_qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    mem_limit: 1g

  n8n:
    image: n8nio/n8n:latest
    container_name: hrbot-n8n-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-8973d464f5f1475b83d6ab88d222d824}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,fs
      N8N_SECURE_COOKIE: "false"
      N8N_PAYLOAD_SIZE_MAX: "128"
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - hrbot_n8n_data:/home/node/.n8n
      - ./files:/home/node/.n8n-files
    mem_limit: 2g

  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - nocodb_data:/usr/app/data
    mem_limit: 1g

  auth:
    image: node:20-alpine
    container_name: hr-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: hrbot
      PG_USER: hrbot
      PG_PASSWORD: hrchatbot
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_hrbot_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./auth-service:/app
      - ./files:/app/chat-files
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    command: sh -c "which magick >/dev/null || apk add --no-cache imagemagick tesseract-ocr-data-osd; node server.js"

  gateway:
    image: nginx:alpine
    container_name: hr-gateway
    restart: unless-stopped
    depends_on:
      - auth
      - n8n
    ports:
      - "8082:80"
    volumes:
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./chat:/usr/share/nginx/chat:ro
      - ./files:/usr/share/nginx/chat-files

networks:
  default:
    name: hrbot_net
    external: true

volumes:
  hrbot_pg_data:
    external: true
  hrbot_qdrant_data:
    external: true
  hrbot_n8n_data:
    external: true
  nocodb_data:
    external: true
