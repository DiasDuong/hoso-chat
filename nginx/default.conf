server {
  listen 80;
  charset utf-8;
  client_max_body_size 128m;
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Chatbot Ho So Nhan Su: Chuyen qua backend hr-auth de xac thuc JWT va phan quyen RBAC nghiem ngat
  location = /chat/api {
    auth_basic off;
    proxy_pass http://hr-auth:3000/api/hoso/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location = / { return 302 /chat/; }
  location = /chat { return 301 /chat/; }
  location = /index.html { return 302 /chat/$is_args$args; }

  # Truy cập tệp đính kèm hội thoại: Chuyển tiếp qua hr-auth để xác thực JWT / RBAC
  # Tuyệt đối không mở công khai thư mục tệp tin ra Internet (Hạng mục 3)
  location /chat/files/ {
    auth_basic off;
    proxy_pass http://hr-auth:3000/api/chat-files/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Thư mục lưu trữ tệp nội bộ: CHỈ cho phép Nginx phục vụ khi có X-Accel-Redirect từ backend
  # Chặn 100% mọi truy cập trực tiếp từ bên ngoài (internal directive)
  location /internal-chat-files/ {
    internal;
    alias /usr/share/nginx/chat-files/;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Lịch sử chat theo từng tài khoản đăng nhập: GET/PUT /chat/history
  # Lưu ở chat-files/_history_<user>.json (tên bắt đầu bằng _ nên không truy cập được qua /chat/files/)
  location = /chat/history {
    auth_basic "Ho so nhan su";
    auth_basic_user_file /etc/nginx/.htpasswd;
    alias /usr/share/nginx/chat-files/_history_$remote_user.json;
    dav_methods PUT;
    dav_access user:rw ;
    client_max_body_size 8m;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Proxy Auth, Conversations & General AI APIs to hr-auth service
  location /api/ {
    auth_basic off;
    proxy_pass http://hr-auth:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # Chan truy cap truc tiep vao webhook hr-policy-chat noi bo tu ben ngoai (bat buoc di qua /api/policy)
  location = /webhook/hr-policy-chat {
    default_type application/json;
    return 403 '{"error": "403 Forbidden: Direct webhook access prohibited. Please use authenticated API endpoints."}\n';
  }

  # Chan truy cap truc tiep vao webhook hoso-chat noi bo tu ben ngoai (bat buoc di qua /chat/api hoac /api/hoso/chat)
  location ~* ^/webhook/hoso-chat {
    default_type application/json;
    return 403 '{"error": "403 Forbidden: Direct webhook access to hoso-chat prohibited. Please use authenticated API endpoints."}\n';
  }

  # Proxy webhook directly to n8n (cho hr-admin-api va hr-upload-api cua trang quan tri van ban)
  location /webhook/ {
    auth_basic off;
    proxy_pass http://n8n:5678/webhook/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # Chuyển hướng toàn bộ các đường dẫn login riêng lẻ về cổng duy nhất /chat/
  location ~* ^/login {
    return 302 /chat/;
  }

  location = /hr-admin.html {
    auth_basic off;
    # Chặn truy cập trực tiếp từ thanh địa chỉ trình duyệt, tự động chuyển hướng về /chat/
    if ($http_sec_fetch_dest = "document") {
      return 302 /chat/;
    }
    root /usr/share/nginx/chat;
    try_files /hr-admin.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location ~* ^/(hr\.css|.+\.(?:png|jpg|jpeg|gif|ico|svg|css|js|csv))$ {
    auth_basic off;
    root /usr/share/nginx/chat;
    try_files $uri =404;
  }

  location ^~ /chat/templates/ {
    auth_basic off;
    alias /usr/share/nginx/chat/templates/;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location /chat/ {
    auth_basic off;
    root /usr/share/nginx;
    index index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location / { return 404; }
}