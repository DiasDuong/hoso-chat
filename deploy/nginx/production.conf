# ==============================================================================
# SOTRANS HUB — PRODUCTION NGINX HARDENED CONFIGURATION (RECONCILED)
# TLS 1.3, Strict Security Headers, Rate Limiting, X-Accel-Redirect
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_rate_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Automatic Redirect to HTTPS & ACME Challenge
# ------------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name hub.sotrans.com.vn;

  # Allow ACME HTTP-01 challenge for Let's Encrypt automated certificate renewal
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Production Application & Reverse Proxy
# ------------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name hub.sotrans.com.vn;

  charset utf-8;
  client_max_body_size 30m; # Enforce 30MB max upload buffer (Application limit: 25MB)

  # SSL / TLS Modern Cryptographic Configuration
  ssl_certificate /etc/nginx/ssl/live/hub.sotrans.com.vn/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/hub.sotrans.com.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Production Security Headers (HSTS PRELOAD INTENTIONALLY EXCLUDED UNTIL SUBDOMAIN AUDIT)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;

  # Root & UI Navigation
  location = / { return 302 /chat/; }
  location = /chat { return 301 /chat/; }
  location = /index.html { return 302 /chat/; }
  location ~* ^/login { return 302 /chat/; }

  # Static Chat Assets
  location /chat/ {
    root /usr/share/nginx;
    index index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  }

  location ~* ^/(hr\.css|.+\.(?:png|jpg|jpeg|gif|ico|svg|css|js|csv))$ {
    root /usr/share/nginx/chat;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # Authentication Endpoints (Brute-Force Rate Limiting)
  location /api/auth/login {
    limit_req zone=auth_rate_limit burst=5 nodelay;
    proxy_pass http://auth:3000/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  # File Upload Endpoints (Upload Rate Limiting & Resource Protection)
  location ~* ^/api/(analytics|bi)/files/upload {
    limit_req zone=upload_rate_limit burst=3 nodelay;
    proxy_pass http://auth:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 25m;
  }

  # Core API & General AI Endpoints
  location /api/ {
    limit_req zone=api_general_limit burst=20 nodelay;
    proxy_pass http://auth:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 60s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Server-Sent Events (SSE) Streaming Support for General AI Chat
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
  }

  # Health Check Endpoint
  location /health {
    proxy_pass http://auth:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Protected Internal File Downloads (X-Accel-Redirect)
  # ZERO direct access from internet; served strictly upon verified backend authorization
  location /internal-chat-files/ {
    internal;
    alias /usr/share/nginx/chat-files/;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Block Direct Ingress to Internal Webhooks
  location = /webhook/hr-policy-chat {
    default_type application/json;
    return 403 '{"error": "403 Forbidden: Direct webhook ingress prohibited. Use authenticated API."}\n';
  }

  location ~* ^/webhook/hoso-chat {
    default_type application/json;
    return 403 '{"error": "403 Forbidden: Direct webhook ingress prohibited. Use authenticated API."}\n';
  }

  # Default Catch-All
  location / {
    return 404;
  }
}
